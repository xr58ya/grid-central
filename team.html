<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101112">
    <meta name="robots" content="noindex">
    <title>Grid Central Team Hub</title>
    <style>
      :root{color-scheme:dark;--bg:#101112;--surface:#17191a;--surface-2:#1f2223;--border:#2b2e2f;--muted:#8b9089;--text:#eef0ea;--accent:#d2ff50;--warn:#ffb547;--bad:#ff6464;--good:#7fe0c2;--font:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:18px 16px 40px}
      main{max-width:1100px;margin:0 auto;display:grid;gap:12px}
      header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
      h1{margin:4px 0 0;font-size:24px}
      .brand{font-weight:800;font-size:13px;letter-spacing:1px}.brand span{color:var(--accent)}
      .sub{color:var(--muted);font-size:14px;margin-top:4px}
      .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
      .chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
      .chip.live{color:var(--accent)}.chip.bad{color:var(--bad)}
      .banner{padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:18px;letter-spacing:1px}
      .banner.box{background:var(--accent);color:#141a08}.banner.yellow{background:#ffd23f;color:#1a1600}.banner.red{background:#e43d3d}.banner.blue{background:#2d6cff}.banner.black{background:#000;border:2px solid #fff}.banner.white{background:#f4f4f4;color:#111}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
      .stat,.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
      .stat small,.card h2{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
      .stat strong{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
      .two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
      @media(max-width:800px){.two{grid-template-columns:1fr}}
      table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
      th{font-size:10px;letter-spacing:1px;color:var(--muted);text-align:left;padding:0 6px 6px}
      td{padding:7px 6px;border-top:1px solid var(--border);white-space:nowrap}
      tr.me td{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
      tr.pit td{color:var(--muted)}
      .n{border-left:3px solid var(--cc,#666);padding-left:6px;font-weight:800}
      .advice{font-size:20px;font-weight:800;margin:4px 0 10px}
      .advice.urgent{color:var(--accent)}
      .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
      .stats b{display:block;font-size:17px}.stats span{font-size:11px;color:var(--muted)}
      .is-good{color:var(--good)}.is-warn{color:var(--warn)}.is-bad{color:var(--bad)}
      ol.radio{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:380px;overflow:auto}
      ol.radio li{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.4}
      ol.radio b{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted)}
      ol.radio li.crew{background:color-mix(in srgb,var(--accent) 12%,var(--surface-2))}
      form{display:grid;grid-template-columns:120px 1fr auto;gap:8px;margin-top:10px}
      input{height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 10px;font:inherit;min-width:0}
      button{height:42px;border-radius:10px;border:0;background:var(--accent);color:#141a08;font-weight:800;padding:0 16px;font:inherit;font-weight:800;cursor:pointer}
      .note{color:var(--muted);font-size:12px;margin:8px 0 0}
      .empty{color:var(--muted);font-size:14px}
      .hidden{display:none!important}
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="brand">GC<span>.</span> GRID CENTRAL · TEAM HUB</div><h1 id="team">Team hub</h1><div class="sub" id="where">Connecting…</div></div>
        <span class="chip" id="state"><i></i> CONNECTING</span>
      </header>
      <div class="banner hidden" id="banner"></div>
      <section class="grid">
        <div class="stat"><small>Position</small><strong id="pos">—</strong><span id="pos-note"></span></div>
        <div class="stat"><small>Lap</small><strong id="lap">—</strong><span id="left"></span></div>
        <div class="stat"><small>Last lap</small><strong id="last">—</strong><span id="best"></span></div>
        <div class="stat"><small>Gap ahead</small><strong id="ahead">—</strong><span id="ahead-who"></span></div>
        <div class="stat"><small>Gap behind</small><strong id="behind">—</strong><span id="behind-who"></span></div>
        <div class="stat"><small>Fuel</small><strong id="fuel">—</strong><span id="fuel-laps"></span></div>
      </section>
      <section class="two">
        <div class="card"><h2>Standings</h2><table id="standings"><tbody><tr><td class="empty">Waiting for the car.</td></tr></tbody></table></div>
        <div style="display:grid;gap:12px;align-content:start">
          <div class="card"><h2>Race strategy</h2><div class="advice" id="advice">—</div><div class="stats" id="stats"></div><p class="note" id="team-line"></p></div>
          <div class="card"><h2>Radio</h2><ol class="radio" id="radio" translate="no"><li class="empty">Race calls and team messages appear here.</li></ol>
            <form id="chat"><input id="chat-name" placeholder="Your name" maxlength="30" autocomplete="name"><input id="chat-text" placeholder="Message to the driver" maxlength="200" autocomplete="off"><button type="submit">Send</button></form>
            <p class="note">Messages are read out to the driver by their race engineer.</p></div>
        </div>
      </section>
    </main>
    <script src="es.js"></script>
    <script src="i18n.js"></script>
    <script src="team.js"></script>
  </body>
</html>
